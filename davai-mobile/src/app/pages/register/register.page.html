<ion-content class="auth-content" [scrollY]="true">
  <div class="auth-wrap">

    <button class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back"></ion-icon>
    </button>

    <div class="auth-brand">
      <span class="brand-wordmark">DAVAI</span>
    </div>

    <div class="auth-head">
      <h1>Create account</h1>
      <p>Free forever. No credit card.</p>
    </div>

    <div class="error-box" *ngIf="error()">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>{{ error() }}</span>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap" [class.focused]="nameFocused">
        <ion-icon name="person-outline"></ion-icon>
        <input type="text" placeholder="Your name" [(ngModel)]="name"
               (focus)="nameFocused=true" (blur)="nameFocused=false" autocomplete="name"/>
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <div class="input-wrap" [class.focused]="emailFocused">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" placeholder="you@school.edu" [(ngModel)]="email"
               (focus)="emailFocused=true" (blur)="emailFocused=false"
               autocomplete="email" inputmode="email"/>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap" [class.focused]="pwFocused">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input [type]="showPw ? 'text' : 'password'" placeholder="Min. 6 characters"
               [(ngModel)]="password"
               (focus)="pwFocused=true" (blur)="pwFocused=false"
               autocomplete="new-password"/>
        <button class="eye-btn" (click)="togglePw()">
          <ion-icon [name]="showPw ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Program</label>
      <div class="seg-row">
        <button *ngFor="let p of programs" class="seg-btn"
                [class.active]="program === p" (click)="program = p">{{ p }}</button>
      </div>
    </div>

    <button class="btn-primary" (click)="submit()" [disabled]="loading()">
      <ion-spinner *ngIf="loading()" name="crescent"></ion-spinner>
      <span *ngIf="!loading()">Create Free Account</span>
    </button>

    <div class="divider"><span>or</span></div>

    <button class="btn-secondary" (click)="continueAsGuest()">Continue as Guest</button>

    <div class="auth-foot">
      <span>Have an account?</span>
      <button (click)="goToLogin()">Sign in</button>
    </div>

  </div>
</ion-content>
